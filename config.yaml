baseURL: "https://rana-trispective.github.io/"
title: "TRISPECTIVE"
copyright: "Copyright &#169; 2026 TRISPECTIVE by Rana. All rights reserved."
languageCode: "en-us"
theme: "hugotheme-vibrantshadows"

taxonomies:
  tag: "tags"

# Markdown rendering, syntax highlighting aur Obsidian ==highlights== support
markup:
  goldmark:
    extensions:
      mark: true
    renderer:
      unsafe: true
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: "dracula"
    tabWidth: 2
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2

# CSS processors aur purge ke liye stats tracking
build:
  writeStats: true

params:
  faviconTags: |
    <link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon.png" | relURL }}?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "favicon.png" | relURL }}?v=2">
  favicon: "favicon.png"
  favicon32: "favicon-32x32.png"
  favicon16: "favicon-16x16.png"
  customCSS: ["css/custom.css"]
  backgImage:
    landingPage: "/images/hero.jpg"
    post: "enable"
  social:
    profiles:
      github: "https://github.com/rana-trispective"
      instagram: "https://www.instagram.com/about_.rrr"
      twitter: ""
    share: ["twitter", "linkedin", "telegram", "whatsapp", "reddit"]
  meta:
    author: "Rana"
    footerMessage: "Designed for clarity, focus, and deep learning."
    tagline: "TRISPECTIVE"
    description: "Personal digital garden and essays on ideas, tools, and systems by Rana."
    contentLicense: "CC-BY-SA-4.0"
    titleSeparator: " | "
    attribution: "disable"
  brand:
    name: "TRISPECTIVE"
    logo_32px: "/assets/favicon/my-logo.png"
    color: "#0a0c10"
    navbar: ["logo", "title"]
  theme:
    nav: "#0a0c10"
    antinav: "#f0f6fc"
    mat: "#0d1117"
    clr1: "#161b22"
    clr2: "#21262d"
    borders: "rounded"
    gradientDirection:
      background: "ltr"
      text: "ltr"
      button: "ltr"
  position:
    social:
      profiles: "footer"
      share: "top"
    navbarMenu: "right"
    postMeta:
      readingTime:
        summary: "top"
        content: "top"
      author:
        summary: "top"
        content: "top"
      lastUpdated:
        summary: "top"
        content: "top"
      tags:
        summary: "bottom"
        content: "bottom"
  font:
    general:
      family: "Inter"
    heading:
      list: ["h1", "h2", "h3"]
      family: "Inter"
    description:
      family: "Inter"
    brand:
      family: "Inter"
    footer:
      family: "Inter"
  faviconTags: |
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.BaseURL }}/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.BaseURL }}/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.BaseURL }}/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="{{ site.BaseURL }}/assets/favicon/site.webmanifest">
    <link rel="mask-icon" href="{{ site.BaseURL }}/assets/favicon/safari-pinned-tab.svg" color="#388bfd">
    <link rel="icon" href="{{ site.BaseURL }}/assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="{{ site.BaseURL }}/assets/favicon/favicon.ico" type="image/x-icon">
    <meta name="apple-mobile-web-app-title" content="TRISPECTIVE">
    <meta name="application-name" content="TRISPECTIVE">
    <meta name="msapplication-TileColor" content="#0d1117">
    <meta name="theme-color" content="#0d1117">
  seo:
    switch: "on"
    twitter:
      card: "enable"
      handle: ""
    facebook:
      openGraph: "enable"
    jsonLD: "enable"
    speedMode: "enable"
  cookieConsent:
    switch: "off"
  userExperience:
    googleAnalytics:
      script: 0
      loading: "sync"
    postImages:
      thumbnail:
        size: "200px"
        borders: "rounded"
  mainSections: ["post"]

services:
  googleAnalytics:
    id: "G-SE1VGNYWGD"

# Main navigation menu (Editorial + Tools flow)
menu:
  main:
    - identifier: articles
      name: Articles
      url: /post/
      weight: 10
    - identifier: tools
      name: Tools
      url: /tools/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30

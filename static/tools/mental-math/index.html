<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Math Matrix - Premium Brain Training</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] },
                    colors: {
                        cyber: {
                            bg: '#070112',
                            purple: '#9333ea',
                            magenta: '#d946ef',
                            green: '#10b981',
                            red: '#f43f5e',
                            yellow: '#fbbf24',
                            glass: 'rgba(18, 4, 40, 0.75)'
                        }
                    },
                    boxShadow: {
                        'neon-purple': '0 0 20px rgba(147,51,234,0.6), 0 0 40px rgba(147,51,234,0.3)',
                        'neon-magenta': '0 0 20px rgba(217,70,239,0.6), 0 0 40px rgba(217,70,239,0.3)',
                        'neon-green': '0 0 20px rgba(16,185,129,0.6), 0 0 40px rgba(16,185,129,0.3)',
                        'neon-red': '0 0 20px rgba(244,63,94,0.6), 0 0 40px rgba(244,63,94,0.3)',
                        'glass': 'inset 0 0 25px rgba(255,255,255,0.03), 0 10px 40px rgba(0,0,0,0.6)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #070112;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(147, 51, 234, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(217, 70, 239, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.06) 0%, transparent 60%);
            color: white;
            overflow: hidden; /* Prevent scrolling so everything fits on one screen nicely */
            touch-action: manipulation;
            user-select: none;
        }

        .bg-animated {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: move-bg 25s linear infinite;
        }

        .glass-panel {
            background: var(--tw-colors-cyber-glass, rgba(18, 4, 40, 0.75));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(147, 51, 234, 0.25);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
        }

        .game-tile {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border: 2px solid rgba(147, 51, 234, 0.2);
            background: linear-gradient(145deg, rgba(35,12,65,0.85), rgba(15,3,35,0.95));
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            box-shadow: inset 0 0 15px rgba(147, 51, 234, 0.08), 0 4px 10px rgba(0,0,0,0.35);
        }

        .game-tile:hover:not(.matched):not(.locked) {
            border-color: rgba(217, 70, 239, 0.9);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 20px rgba(217, 70, 239, 0.35), inset 0 0 15px rgba(217, 70, 239, 0.25);
        }

        .game-tile.focused {
            border-color: #fbbf24;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(251,191,36,0.7), inset 0 0 15px rgba(251,191,36,0.4);
            z-index: 5;
        }

        .game-tile.selected {
            transform: scale(1.08);
            border-color: #d946ef;
            background: rgba(217, 70, 239, 0.3);
            box-shadow: 0 0 25px #d946ef, inset 0 0 20px #d946ef;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            z-index: 10;
        }

        .game-tile.matched {
            animation: tile-match-advanced 0.5s forwards;
            pointer-events: none;
            border-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 30px #10b981, inset 0 0 20px #10b981;
        }

        .game-tile.shake {
            animation: shake-advanced 0.4s ease-in-out;
            border-color: #f43f5e;
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.25);
            box-shadow: 0 0 25px #f43f5e, inset 0 0 20px #f43f5e;
            z-index: 10;
        }

        .game-tile.appear {
            animation: tile-appear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.3);
        }

        @keyframes move-bg { 0% { background-position: 0 0; } 100% { background-position: -50px 50px; } }
        @keyframes tile-appear { to { opacity: 1; transform: scale(1); } }
        
        @keyframes tile-match-advanced {
            0% { transform: scale(1.05); filter: brightness(1.6); opacity: 1; }
            40% { transform: scale(1.2); filter: brightness(2.2); opacity: 1; }
            100% { transform: scale(0) rotate(15deg); opacity: 0; visibility: hidden; display: none; }
        }

        @keyframes shake-advanced {
            0%, 100% { transform: translateX(0) scale(1.05); }
            20% { transform: translateX(-10px) rotate(-3deg) scale(1.05); }
            40% { transform: translateX(10px) rotate(3deg) scale(1.05); }
            60% { transform: translateX(-6px) rotate(-1.5deg) scale(1.05); }
            80% { transform: translateX(6px) rotate(1.5deg) scale(1.05); }
        }

        @keyframes pop-score {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #10b981; text-shadow: 0 0 20px #10b981; }
            100% { transform: scale(1); }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(147,51,234,0.9)); }
            15% { transform: scale(1.3); filter: drop-shadow(0 0 15px rgba(217,70,239,1)); }
            30% { transform: scale(1); }
            45% { transform: scale(1.3); filter: drop-shadow(0 0 15px rgba(217,70,239,1)); }
        }

        .pop-text { animation: pop-score 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .heart-beat { animation: beat 1.2s ease-in-out infinite; }
        .streak-glow { text-shadow: 0 0 15px #fbbf24, 0 0 30px #fbbf24; }

        .overlay-screen {
            backdrop-filter: blur(15px);
            background-color: rgba(7, 1, 18, 0.9);
        }

        #timer-bar { transition: width 1s linear, background-color 0.5s; }
    </style>
</head>
<body class="font-poppins h-screen w-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden">

    <div class="bg-animated"></div>

    <!-- Menu Screen -->
    <div id="menu-screen" class="w-full max-w-2xl flex flex-col items-center text-center space-y-6 transition-opacity duration-500 z-10 px-4">
        
        <!-- Top Utility Bar: Sound Toggle -->
        <div class="w-full flex justify-end">
            <button onclick="toggleSound()" id="sound-toggle-btn" class="glass-panel px-3.5 py-2 rounded-xl text-cyber-purple hover:text-white border-cyber-purple/40 hover:border-cyber-magenta hover:shadow-neon-purple transition-all flex items-center gap-2 text-xs font-bold">
                <span id="sound-icon">🔊</span> <span id="sound-text">Sound: ON</span>
            </button>
        </div>

        <div class="space-y-3 relative">
            <div class="absolute -inset-6 bg-gradient-to-r from-cyber-purple to-cyber-magenta blur-3xl opacity-25 rounded-full"></div>
            <p class="text-cyber-magenta text-xs font-extrabold tracking-[0.3em] uppercase drop-shadow">Premium Math Brain Training</p>
            <h1 class="relative text-3xl sm:text-5xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyber-purple via-cyber-magenta to-teal-400 drop-shadow-[0_0_25px_rgba(217,70,239,0.5)]">
                NEON MATH MATRIX
            </h1>
        </div>

        <div class="flex flex-col w-full max-w-sm space-y-3">
            <button onclick="startGame('beginner')" class="group relative px-6 py-4 glass-panel border-cyber-purple text-cyber-purple text-base sm:text-lg font-black rounded-xl uppercase tracking-wider hover:bg-gradient-to-r hover:from-cyber-purple hover:to-cyber-magenta hover:text-white hover:border-transparent hover:shadow-neon-magenta transition-all duration-300">
                Beginner Matrix
                <span class="block text-[10px] font-semibold opacity-80 mt-0.5 text-gray-400 group-hover:text-white">Target Sum: 20 - 100</span>
            </button>
            <button onclick="startGame('middle')" class="group relative px-6 py-4 glass-panel border-cyber-green text-cyber-green text-base sm:text-lg font-black rounded-xl uppercase tracking-wider hover:bg-gradient-to-r hover:from-cyber-green hover:to-teal-500 hover:text-white hover:border-transparent hover:shadow-neon-green transition-all duration-300">
                Middle Matrix
                <span class="block text-[10px] font-semibold opacity-80 mt-0.5 text-gray-400 group-hover:text-white">Target Sum: 110 - 1000</span>
            </button>
            <button onclick="startGame('hard')" class="group relative px-6 py-4 glass-panel border-cyber-red text-cyber-red text-base sm:text-lg font-black rounded-xl uppercase tracking-wider hover:bg-gradient-to-r hover:from-cyber-red hover:to-orange-500 hover:text-white hover:border-transparent hover:shadow-neon-red transition-all duration-300">
                Hard Matrix
                <span class="block text-[10px] font-semibold opacity-80 mt-0.5 text-gray-400 group-hover:text-white">Target Sum: 1010 - 10000</span>
            </button>
        </div>

        <!-- Keyboard Instructions -->
        <div class="glass-panel p-3 rounded-xl flex flex-wrap justify-center gap-3 sm:gap-4 text-xs text-gray-300 border border-gray-700/50 shadow-lg">
            <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 bg-gray-900 rounded border border-gray-700 font-mono text-white">⬆⬇⬅➡</span> <span class="font-semibold tracking-wider">NAVIGATE</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 bg-gray-900 rounded border border-gray-700 font-mono text-white">SPACE</span> <span class="font-semibold tracking-wider">SELECT / DESELECT</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 bg-gray-900 rounded border border-gray-700 font-mono text-white">R</span> <span class="font-semibold tracking-wider">RESTART</span>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden w-full max-w-3xl flex flex-col space-y-2.5 animate-fade-in z-10 relative px-2 my-auto">
        
        <!-- Header Controls -->
        <header class="flex justify-between items-center">
            <button onclick="backToMenu()" class="group text-xs text-gray-400 hover:text-white px-3 py-1.5 glass-panel rounded-xl hover:border-cyber-purple hover:bg-cyber-purple/20 hover:shadow-neon-purple transition-all flex items-center gap-1">
                <span class="text-sm">←</span> <span class="font-bold tracking-wider uppercase">Menu</span>
                <span class="hidden md:inline text-[9px] bg-gray-900 border border-gray-700 px-1 py-0.2 rounded font-mono group-hover:bg-purple-900">Esc</span>
            </button>
            
            <div class="text-center glass-panel px-3 py-1 rounded-xl border-cyber-magenta/50">
                <p class="text-[9px] text-cyber-magenta font-black tracking-[0.2em] uppercase">Matrix Level</p>
                <p id="level-display" class="text-base font-black text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">1</p>
            </div>

            <button onclick="restartGame()" class="group text-xs text-gray-400 hover:text-white px-3 py-1.5 glass-panel rounded-xl hover:border-cyber-yellow hover:bg-cyber-yellow/20 hover:shadow-neon-yellow transition-all flex items-center gap-1">
                <span class="font-bold tracking-wider uppercase">Restart</span> <span class="text-sm">↻</span>
                <span class="hidden md:inline text-[9px] bg-gray-900 border border-gray-700 px-1 py-0.2 rounded font-mono group-hover:bg-yellow-900">R</span>
            </button>
        </header>

        <!-- Timer Progress Bar -->
        <div class="w-full bg-gray-900/90 rounded-full h-2 overflow-hidden relative border border-gray-700/80 shadow-inner">
            <div id="timer-bar" class="h-full bg-gradient-to-r from-cyber-purple via-cyber-magenta to-cyber-red w-full"></div>
            <div class="absolute inset-0 flex items-center justify-center text-[9px] font-black text-white/90 drop-shadow-md z-10 uppercase tracking-widest">
                <span id="timer-text">60s</span>
            </div>
        </div>

        <!-- Stat Cards -->
        <div class="grid grid-cols-4 gap-2">
            <!-- Target Sum -->
            <div class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center border-b-4 border-cyber-magenta shadow-[inset_0_0_15px_rgba(217,70,239,0.1)] relative">
                <p class="text-gray-400 font-bold uppercase tracking-[0.15em] text-[9px] mb-0.5">Target</p>
                <h2 id="target-display" class="text-lg sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-cyber-magenta drop-shadow-[0_0_12px_rgba(217,70,239,0.8)] relative z-10">
                    0
                </h2>
            </div>
            
            <!-- Score -->
            <div class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center border-b-4 border-cyber-green shadow-[inset_0_0_15px_rgba(16,185,129,0.1)]">
                <p class="text-gray-400 font-bold uppercase tracking-[0.15em] text-[9px] mb-0.5">Score</p>
                <h2 id="score-display" class="text-lg sm:text-2xl font-black text-cyber-green drop-shadow-[0_0_12px_rgba(16,185,129,0.8)]">
                    0
                </h2>
            </div>

            <!-- Purple Lives / Hearts -->
            <div class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center border-b-4 border-cyber-purple shadow-[inset_0_0_15px_rgba(147,51,234,0.1)]">
                <p class="text-gray-400 font-bold uppercase tracking-[0.15em] text-[9px] mb-0.5">Lives</p>
                <div id="lives-display" class="flex gap-1 text-base sm:text-xl mt-0.5">
                    <span class="heart-beat">💜</span>
                    <span class="heart-beat">💜</span>
                    <span class="heart-beat">💜</span>
                </div>
            </div>

            <!-- Streak Multiplier -->
            <div class="glass-panel p-2 rounded-xl flex flex-col items-center justify-center border-b-4 border-cyber-yellow shadow-[inset_0_0_15px_rgba(251,191,36,0.1)]">
                <p class="text-gray-400 font-bold uppercase tracking-[0.15em] text-[9px] mb-0.5">Combo</p>
                <h2 id="streak-display" class="text-lg sm:text-xl font-black text-cyber-yellow drop-shadow-[0_0_10px_rgba(251,191,36,0.6)]">
                    x1
                </h2>
            </div>
        </div>

        <!-- 5x4 Grid Container -->
        <div id="game-grid" class="grid grid-cols-5 gap-2 p-3 glass-panel rounded-2xl border-gray-700/50 shadow-2xl relative">
            <!-- Tiles injected dynamically -->
            
            <!-- Level Clear Overlay -->
            <div id="level-clear-overlay" class="hidden overlay-screen absolute inset-0 rounded-[1.5rem] flex flex-col items-center justify-center z-50 transition-opacity">
                <h3 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-cyber-green to-teal-400 drop-shadow-[0_0_20px_rgba(16,185,129,0.8)] mb-2 animate-bounce text-center">MATRIX CLEARED!</h3>
                <p id="level-bonus" class="text-cyber-yellow font-bold text-sm sm:text-lg tracking-wide mb-4 bg-black/60 px-5 py-2 rounded-full border border-cyber-yellow/40"></p>
                <p class="text-xs text-white font-semibold tracking-[0.25em] uppercase opacity-80 animate-pulse">Initializing Next Matrix...</p>
            </div>

            <!-- Game Over Overlay -->
            <div id="game-over-overlay" class="hidden overlay-screen absolute inset-0 rounded-[1.5rem] flex flex-col items-center justify-center z-50">
                <h3 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-cyber-red to-orange-500 drop-shadow-[0_0_20px_rgba(244,63,94,0.8)] mb-2 text-center">SYSTEM OVERLOAD</h3>
                <p id="game-over-reason" class="text-gray-300 text-sm sm:text-base font-semibold uppercase tracking-widest mb-5">Out of Lives</p>
                <button onclick="restartGame()" class="group px-6 py-3 bg-gradient-to-r from-cyber-red to-orange-600 text-white text-base font-black rounded-xl hover:shadow-neon-red transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2">
                    RETRY MATRIX <span class="text-[10px] bg-black/30 px-1.5 py-0.5 rounded font-mono font-normal">Space</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer for Minimal Premium Sound Effects ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(frequency, type, duration, gainValue = 0.05) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = frequency;
                
                gain.gain.setValueAtTime(gainValue, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log('Audio playback notice:', e);
            }
        }

        function playSelectSound() { playTone(659.25, 'sine', 0.05, 0.03); } 
        function playMatchSound() { 
            // Hacker-style high-tech dopamine chirp sequence
            playTone(1046.50, 'sawtooth', 0.06, 0.04); 
            setTimeout(() => playTone(1318.51, 'square', 0.06, 0.04), 35); 
            setTimeout(() => playTone(1567.98, 'sawtooth', 0.08, 0.04), 70); 
            setTimeout(() => playTone(2093.00, 'triangle', 0.12, 0.05), 105); 
        }
        function playErrorSound() { playTone(140, 'sawtooth', 0.15, 0.05); }
        function playWinSound() {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'triangle', 0.15, 0.07), i * 80);
            });
        }
        function playGameOverSound() {
            [300, 240, 190, 140].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'sawtooth', 0.18, 0.07), i * 90);
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const text = document.getElementById('sound-text');
            if (soundEnabled) {
                icon.innerText = '🔊';
                text.innerText = 'Sound: ON';
                playSelectSound();
            } else {
                icon.innerText = '🔇';
                text.innerText = 'Sound: OFF';
            }
        }

        // --- Game State Variables ---
        let currentMode = '';
        let currentLevel = 1;
        let score = 0;
        let targetSum = 0;
        
        let firstSelection = null;
        let secondSelection = null;
        let lockBoard = false;
        let matchedPairs = 0;

        const MAX_LIVES = 3;
        let lives = MAX_LIVES;
        let streak = 1;
        
        let timerInterval = null;
        const MAX_TIME = 60;
        let timeLeft = MAX_TIME;

        let focusIndex = -1; 
        let gridTiles = []; 
        const COLUMNS = 5; 
        const ROWS = 4;    

        // DOM Elements
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const gridElement = document.getElementById('game-grid');
        const targetDisplay = document.getElementById('target-display');
        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const streakDisplay = document.getElementById('streak-display');
        const livesDisplay = document.getElementById('lives-display');
        
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        
        const levelClearOverlay = document.getElementById('level-clear-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const levelBonusText = document.getElementById('level-bonus');
        const gameOverReason = document.getElementById('game-over-reason');

        // --- Core Rules & Logic ---

        function startGame(mode) {
            currentMode = mode;
            currentLevel = 1;
            score = 0;
            updateScore(0);
            
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            initLevel();
        }

        function backToMenu() {
            clearInterval(timerInterval);
            gameScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            focusIndex = -1;
        }

        function restartGame() {
            lives = MAX_LIVES;
            streak = 1;
            updateLivesUI();
            updateStreakUI();
            
            score = 0;
            updateScore(0);
            
            gameOverOverlay.classList.add('hidden');
            initLevel();
        }

        function generateTargetSum() {
            let minSum, maxSum;
            switch(currentMode) {
                case 'beginner': minSum = 2; maxSum = 10; break;
                case 'middle': minSum = 11; maxSum = 100; break;
                case 'hard': minSum = 101; maxSum = 1000; break;
            }
            return (Math.floor(Math.random() * (maxSum - minSum + 1)) + minSum) * 10;
        }

        function generateNumbers(target) {
            let pairs = [];
            let usedNumbers = new Set();
            let attempts = 0;

            while (pairs.length < 20) {
                attempts++;
                let num1 = Math.floor(Math.random() * (target - 1)) + 1;
                let num2 = target - num1;

                if (num1 !== num2 && !usedNumbers.has(num1) && !usedNumbers.has(num2)) {
                    pairs.push(num1, num2);
                    usedNumbers.add(num1);
                    usedNumbers.add(num2);
                } else if (attempts > 500) {
                    if (num1 !== num2) {
                        pairs.push(num1, num2);
                        attempts = 0; 
                    }
                }
            }

            for (let i = pairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
            }
            return pairs;
        }

        function initLevel() {
            clearInterval(timerInterval);
            
            firstSelection = null;
            secondSelection = null;
            lockBoard = false;
            matchedPairs = 0;
            focusIndex = -1;
            gridTiles = [];
            
            lives = MAX_LIVES;
            updateLivesUI();
            updateStreakUI();

            levelClearOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            
            levelDisplay.innerText = currentLevel;
            targetSum = generateTargetSum();
            targetDisplay.innerText = targetSum;

            timeLeft = MAX_TIME;
            updateTimerUI();
            timerInterval = setInterval(handleTimer, 1000);

            const tiles = generateNumbers(targetSum);
            renderGrid(tiles);
        }

        function handleTimer() {
            if(lockBoard && !firstSelection && !secondSelection) return; 
            
            timeLeft--;
            updateTimerUI();

            if(timeLeft <= 0) {
                lives--;
                updateLivesUI();
                playErrorSound();
                
                if(lives <= 0) {
                    clearInterval(timerInterval);
                    playGameOverSound();
                    triggerGameOver("System Time Expired!");
                } else {
                    timeLeft = 25; // Rescue time
                    updateTimerUI();
                    document.body.style.boxShadow = "inset 0 0 60px rgba(244,63,94,0.7)";
                    setTimeout(() => document.body.style.boxShadow = "", 400);
                }
            }
        }

        function updateTimerUI() {
            const percentage = (timeLeft / MAX_TIME) * 100;
            timerBar.style.width = `${Math.min(100, Math.max(0, percentage))}%`;
            timerText.innerText = `${timeLeft}s`;
            
            if(percentage > 50) {
                timerBar.className = "h-full bg-gradient-to-r from-cyber-purple via-cyber-magenta to-teal-400 w-full transition-all duration-1000";
            } else if(percentage > 20) {
                timerBar.className = "h-full bg-gradient-to-r from-cyber-yellow to-orange-500 w-full transition-all duration-1000";
            } else {
                timerBar.className = "h-full bg-gradient-to-r from-cyber-red to-red-800 w-full transition-all duration-1000 animate-pulse";
            }
        }

        function renderGrid(tiles) {
            gridElement.innerHTML = '';
            gridElement.appendChild(levelClearOverlay);
            gridElement.appendChild(gameOverOverlay);

            tiles.forEach((number, index) => {
                const tile = document.createElement('div');
                tile.className = `game-tile appear text-base sm:text-2xl font-black select-none aspect-square`;
                tile.dataset.value = number;
                tile.dataset.index = index;
                
                if(number >= 1000) {
                    tile.classList.add('text-xs', 'sm:text-lg');
                } else if(number >= 100) {
                    tile.classList.add('text-sm', 'sm:text-xl');
                }

                tile.innerText = number;
                tile.style.animationDelay = `${index * 0.015}s`;
                
                tile.addEventListener('click', () => handleTileClick(tile));
                
                gridElement.appendChild(tile);
                gridTiles.push(tile);
            });
        }

        function handleTileClick(tile) {
            if (lockBoard) return;
            if (tile.classList.contains('matched')) return; 

            // Deselect logic: If clicking/pressing space on the already selected first tile, unselect it
            if (tile === firstSelection) {
                playSelectSound();
                tile.classList.remove('selected');
                firstSelection = null;
                return;
            }

            playSelectSound();
            const idx = parseInt(tile.dataset.index);
            updateFocusVisuals(idx);
            focusIndex = idx;

            if (!firstSelection) {
                firstSelection = tile;
                tile.classList.add('selected');
                return;
            }

            secondSelection = tile;
            tile.classList.add('selected');
            lockBoard = true; 

            checkMatch();
        }

        function checkMatch() {
            const val1 = parseInt(firstSelection.dataset.value);
            const val2 = parseInt(secondSelection.dataset.value);
            const sum = val1 + val2;

            if (sum === targetSum) {
                playMatchSound();
                const pointsEarned = 10 * streak;
                score += pointsEarned;
                updateScore(score);
                
                timeLeft = Math.min(MAX_TIME, timeLeft + 3);
                updateTimerUI();
                
                firstSelection.classList.remove('selected');
                secondSelection.classList.remove('selected');
                firstSelection.classList.add('matched');
                secondSelection.classList.add('matched');
                
                streak++;
                updateStreakUI();
                
                matchedPairs++;
                
                if (matchedPairs === 10) {
                    clearInterval(timerInterval);
                    playWinSound();
                    setTimeout(levelUp, 800);
                }
                
                setTimeout(() => {
                    if(matchedPairs !== 10) resetSelection();
                }, 80);

            } else {
                playErrorSound();
                firstSelection.classList.add('shake');
                secondSelection.classList.add('shake');
                
                streak = 1;
                updateStreakUI();
                
                lives--;
                updateLivesUI();

                setTimeout(() => {
                    firstSelection.classList.remove('shake', 'selected');
                    secondSelection.classList.remove('shake', 'selected');
                    resetSelection();
                    
                    if (lives <= 0) {
                        playGameOverSound();
                        triggerGameOver("Out of Lives!");
                    }
                }, 450);
            }
        }

        function resetSelection() {
            firstSelection = null;
            secondSelection = null;
            lockBoard = false;
        }

        function updateScore(newScore) {
            scoreDisplay.innerText = newScore;
            scoreDisplay.classList.remove('pop-text');
            void scoreDisplay.offsetWidth;
            scoreDisplay.classList.add('pop-text');
        }

        function updateStreakUI() {
            streakDisplay.innerText = `x${streak}`;
            streakDisplay.classList.remove('pop-text', 'text-cyber-yellow', 'streak-glow', 'text-white', 'scale-110');
            
            if (streak > 1) {
                streakDisplay.classList.add('pop-text', 'streak-glow', 'text-cyber-yellow', 'scale-110');
            } else {
                streakDisplay.classList.add('text-white');
            }
        }

        function updateLivesUI() {
            let html = '';
            for(let i=0; i<MAX_LIVES; i++) {
                if(i < lives) {
                    html += `<span class="heart-beat drop-shadow-[0_0_10px_rgba(147,51,234,0.9)]">💜</span>`;
                } else {
                    html += `<span class="text-gray-800 opacity-40 grayscale blur-[1px]">🖤</span>`;
                }
            }
            livesDisplay.innerHTML = html;
        }

        function triggerGameOver(reasonText = "Out of Lives!") {
            lockBoard = true;
            clearInterval(timerInterval);
            gameOverReason.innerText = reasonText;
            gameOverOverlay.classList.remove('hidden');
        }

        function levelUp() {
            const lifeBonus = lives * 40;
            const timeBonus = timeLeft * 4;
            const totalBonus = lifeBonus + timeBonus;
            
            score += totalBonus;
            updateScore(score);
            
            levelBonusText.innerHTML = `Life Bonus: +${lifeBonus}<br>Time Bonus: +${timeBonus}`;
            levelClearOverlay.classList.remove('hidden');
            
            setTimeout(() => {
                currentLevel++;
                initLevel();
            }, 2200); 
        }

        function updateFocusVisuals(newIdx) {
            if (focusIndex >= 0 && focusIndex < gridTiles.length) {
                gridTiles[focusIndex].classList.remove('focused');
            }
            if (newIdx >= 0 && newIdx < gridTiles.length) {
                gridTiles[newIdx].classList.add('focused');
            }
        }

        function moveFocus(direction) {
            if (focusIndex === -1) {
                let startIdx = gridTiles.findIndex(t => !t.classList.contains('matched'));
                if (startIdx !== -1) {
                    focusIndex = startIdx;
                    updateFocusVisuals(startIdx);
                }
                return;
            }

            let curr = focusIndex;
            let found = false;
            let safetyLimit = 25; 
            
            while (!found && safetyLimit > 0) {
                safetyLimit--;
                
                if (direction === 'UP') {
                    curr -= COLUMNS;
                    if (curr < 0) break;
                } 
                else if (direction === 'DOWN') {
                    curr += COLUMNS;
                    if (curr >= gridTiles.length) break;
                } 
                else if (direction === 'LEFT') {
                    if (curr % COLUMNS === 0) break;
                    curr -= 1;
                } 
                else if (direction === 'RIGHT') {
                    if (curr % COLUMNS === COLUMNS - 1) break;
                    curr += 1;
                }

                if (curr >= 0 && curr < gridTiles.length) {
                    if (!gridTiles[curr].classList.contains('matched')) {
                        found = true;
                        updateFocusVisuals(curr);
                        focusIndex = curr;
                        break;
                    }
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (gameScreen.classList.contains('hidden')) return;

            if (e.key.toLowerCase() === 'r') {
                restartGame();
                return;
            }
            if (e.key === 'Backspace' || e.key === 'Escape') {
                backToMenu();
                return;
            }

            if (!gameOverOverlay.classList.contains('hidden') && e.key === ' ') {
                restartGame();
                e.preventDefault();
                return;
            }

            if (lockBoard || !levelClearOverlay.classList.contains('hidden') || !gameOverOverlay.classList.contains('hidden')) return;

            if (e.key === 'ArrowUp') { moveFocus('UP'); e.preventDefault(); }
            else if (e.key === 'ArrowDown') { moveFocus('DOWN'); e.preventDefault(); }
            else if (e.key === 'ArrowLeft') { moveFocus('LEFT'); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { moveFocus('RIGHT'); e.preventDefault(); }
            
            else if (e.key === ' ' || e.key === 'Enter') {
                if (focusIndex >= 0 && focusIndex < gridTiles.length) {
                    const targetTile = gridTiles[focusIndex];
                    if (!targetTile.classList.contains('matched')) {
                        handleTileClick(targetTile);
                    }
                }
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
